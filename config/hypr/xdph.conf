# Configuración para xdg-desktop-portal-hyprland (XDPH)
# Documentación: https://wiki.hyprland.org/Hypr-Ecosystem/xdg-desktop-portal-hyprland/

screencopy {
    # Tasa máxima de frames para captura de pantalla / compartir pantalla
    max_fps = 60

    # Marcar automáticamente la casilla "Allow restore token" en el selector.
    # Esto permite que aplicaciones basadas en Chromium / Electron (como Discord y Vesktop)
    # reutilicen la selección aprobada en el primer intento y NO pregunten 3 veces consecutivas.
    allow_token_by_default = true
}
