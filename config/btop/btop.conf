# Config file for btop - Better Window Manager (BWM)

# Name of theme file
color_theme = "matugen"

# Terminal background transparency
theme_background = False

# Truecolor support
truecolor = True

# Rounded corners (False for sharp/retro aesthetic)
rounded_corners = True

# Graph symbol: "braille", "block", "tty"
graph_symbol = "braille"

# Graph symbol for CPU box
graph_symbol_cpu = "default"

# Graph symbol for MEM box
graph_symbol_mem = "default"

# Graph symbol for NET box
graph_symbol_net = "default"

# Graph symbol for PROC box
graph_symbol_proc = "default"

# Update time in milliseconds
update_ms = 1500
