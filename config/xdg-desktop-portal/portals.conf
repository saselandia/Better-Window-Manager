[preferred]
default=hyprland;gtk;
# Nautilus no implementa el portal FileChooser (eso es xdg-desktop-portal-gnome): ponerlo aquí
# hacía que el portal lo lanzara al arrancar y esperase 25 s una respuesta que nunca llega,
# retrasando Quickshell (y su bloqueo de inicio) en cada inicio de sesión.
org.freedesktop.impl.portal.FileChooser=gtk;
