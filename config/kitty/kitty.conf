# ==============================================================================
# Kitty Configuration - Material You & End_4 Aesthetic
# ==============================================================================

# Incluir tema dinámico generado por Matugen
include kitty-colors.conf

# Tipografía
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 9.0

# Ventana y márgenes
window_padding_width 12
placement_strategy   center
hide_window_decorations no
confirm_os_window_close 0

# Cursor
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval -1

# Control remoto para recarga en caliente de colores
allow_remote_control yes
listen_on unix:@kitty

# Opacidad de fondo para estilo translúcido / Omarchy
background_opacity 0.88

# Modo glass (glass.sh): lets a reload change the background opacity, like Omarchy
dynamic_background_opacity yes
include glass.conf
